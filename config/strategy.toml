# ===========================================================================
# FirstKill strategy configuration
#
# Everything here is a tunable. The learning loop is allowed to move some of
# these (marked [auto]) based on realized PnL; the rest are yours alone.
# ===========================================================================

[loop]
# How often open positions are re-priced and exits evaluated. This loop runs
# independently of the entry scan so a slow RPC cannot delay a stop.
tick_seconds = 3.0
# Visor mcap/price. Own loop so a slow Stage-3 enrich cannot freeze the cards.
quote_seconds = 0.4
# How often discovery runs and new candidates are scored.
scan_seconds = 2.0
# A candidate older than this is no longer an early signal, it is a chart.
# 240 = 180 + 60: Hood still prints MFE≥20% in the last 30m of the old window
# (150–180); one extra hour keeps those on the visor without opening 6h charts.
max_candidate_age_minutes = 240
# Hard cap on candidates fully enriched per tick, to bound RPC spend. Only
# candidates that survive the free gates get here, so this is the real budget.
# Hard cap on candidates fully enriched per tick. 0 = every scan card.
# The visor shows a note on each coin, so the default is the whole list.
max_candidates_per_tick = 0
# How many enrichments run at once. Sequential was one SCAN pill on the visor.
enrich_concurrency = 4
# Discovery dumps hundreds of pairs. Cap the visor and skip the rest; vamps
# drop first, mains stay. Unseen names rotate in next scan.
max_watching = 40
# Full enrich this often. Quotes still tick; new coins jump the queue.
rescore_seconds = 15
# Below this the coin is dead. Drop from visor, no enrich/score/sqlite.
dead_mcap_usd = 40000
# Proof of life, with a breakdown of what rejected everything. 0 disables.
heartbeat_seconds = 60.0
# Unused when max_candidates_per_tick is 0 (score the whole visor).
entry_scan_budget_seconds = 6.0


# ---------------------------------------------------------------------------
# Hard gates. Evaluated before scoring. A veto here is absolute - no score,
# however high, can override it. These exist because the failure modes they
# block (rug, honeypot, no exit liquidity) are not survivable losses, they are
# total losses, and no amount of expected value justifies them.
# ---------------------------------------------------------------------------
[gates]
# When a gate's input could not be measured, the gate abstains. In live mode an
# abstention is a veto: a gate you cannot evaluate is a risk you cannot see.
# Flip this to true only if you have decided, on purpose, to trade blind.
allow_unmeasured = false
min_liquidity_usd = 15000.0
min_holder_count = 60
max_dev_holding_pct = 0.05
# A sell quote must come back within this slippage for 1x the intended size,
# or we treat the token as unsellable. This is the honeypot check.
max_sell_slippage_pct = 0.12
# Round-trip cost (in + out + fees + gas) above this leaves no room for edge.
max_round_trip_cost_pct = 0.06
require_mint_authority_revoked = true
require_freeze_authority_revoked = true
# Token-2022 transfer fee, or an EVM sell tax.
max_transfer_tax_pct = 0.05
# Fraction of holders that are wallets less than 24h old. High values mean the
# holder count is manufactured.
max_fresh_wallet_pct = 0.70
# Fraction of supply held by wallets that bought in the launch slot/block
# window. Hard veto (not a score weight). Competing bots with a lower cost basis.
max_bundle_pct = 0.20
# Linked supply (one-hop token funder or Bubblemaps). Same treatment as bundle.
# 0 disables. Playbooks can tighten per chain.
max_cluster_pct = 0.20
# ERC-20 Transfer lookback when measuring EVM bundle/cluster (blocks).
bundle_log_lookback_blocks = 40000
# Only stamp token-funder on the first N unique recipients.
bundle_first_n = 40
# Same-block/slot window around launch for bundle_pct.
bundle_slot_window = 3
# Reuse launch logs / labeled balances this long. Bundle is a launch fact.
bundle_cache_seconds = 60
# One UNKNOWN wallet holding this much circulating supply is a rug. A known
# KOL/whale holding the same share (the $TRUMP *shape* on a fresh launch) is
# not vetoed — it still scores as concentrated, so size stays small.
max_unknown_top1_pct = 0.50
# Circulating top-10 (LP and burn already excluded) above this, unless known
# wallets explain most of that share, is a dump waiting to happen.
max_top10_pct = 0.50


# ---------------------------------------------------------------------------
# Origin. Per chain, only that chain's launchpad. Handmade Raydium/Pancake
# pools are never traded — $TRUMP/$MELANIA were the *shape* of a known-KOL
# top holder, not tokens to buy after they are old.
# ---------------------------------------------------------------------------
[launchpads]
require_launchpad = true

[launchpads.solana]
# pump.fun only. Graduates keep the `pump` mint suffix even on PumpSwap.
dex_ids = ["pumpfun", "pumpswap"]
mint_suffixes = ["pump"]

[launchpads.bnb]
# four.meme is the pump.fun of BNB Chain. Club.fun / flaunch exist; add their
# dex ids here if you decide the extra noise is worth it.
dex_ids = ["fourmeme"]

[launchpads.robinhood_chain]
# Pons and Pools.trade. Graduates land on Uniswap V4, which Dexscreener labels
# `uniswap` - on this chain that is the launchpad exit, not a stealth pool.
# The Robinhood brokerage (majors, US app) is a different product and is off.
dex_ids = ["pons", "pools", "uniswap"]


# ---------------------------------------------------------------------------
# Chart features. Deliberately simple: on a 40-minute-old token there is not
# enough data for anything else to mean anything, and complex indicators on
# thin data are just noise with extra steps.
# ---------------------------------------------------------------------------
[chart]
candle_seconds = 60
lookback_candles = 30
breakout_lookback = 10
volume_zscore_window = 20
# Above this move in the window we are late, not early. Buying a vertical is
# how you inherit somebody else's exit.
parabolic_return_threshold = 1.50
parabolic_window_candles = 5
# Distance above VWAP where entries stop being worth their risk.
max_vwap_deviation = 0.35


# ---------------------------------------------------------------------------
# The frontrun thesis, stated explicitly so it can be falsified.
#
# The edge is NOT sandwiching other people's pending transactions. It is being
# early in the retail adoption curve of a token that is about to have one. The
# measurable form of that: retail terminal inflow (Axiom, Photon, BullX,
# Trojan, Moby, Fomo) is ACCELERATING while its absolute share of holders is
# still LOW. High absolute share means the crowd already arrived and you are
# the exit liquidity.
#
# So the level and the derivative carry opposite signs. That is the whole idea.
# ---------------------------------------------------------------------------
[terminals]
# Above this share of recent buyers, the wave has already happened.
max_retail_terminal_share = 0.45
# Below this acceleration there is no wave forming yet.
min_retail_terminal_share_delta_5m = 0.04
# Sniper/copy-bot share. These are adversaries, not confirmation.
max_sniper_bot_share = 0.35
# Window over which buyer attribution is computed.
attribution_window_minutes = 10
# Cap on transactions inspected per candidate, to bound RPC spend. Each one is
# a separate getTransaction call, so this number multiplied by the candidates
# that survive the free gates is the per-tick RPC bill. 250 x 40 candidates is
# 10k calls per tick, which no RPC serves in three seconds and none serve
# cheaply - hence a number that a paid endpoint can actually keep up with.
max_txs_inspected = 24


[flow]
min_unique_buyers_5m = 25
min_buy_sell_ratio = 1.35
min_net_inflow_usd_5m = 4000.0
# Tracked wallets that we independently measured as profitable, plus the KOL
# list below. A buy from one is the single highest-information feature here.
smart_money_weight_cap = 0.30
# Seed KOLs / known whales. Solana addresses, case-sensitive. The bot adds to
# this set on its own when a wallet shows up on two winning trades.
kol_wallets = []


# ---------------------------------------------------------------------------
# Fomo profiles + Moby-style whales. Research only — never an execution venue.
# Paste wallets into config/whales.toml. MobyScreener has no API; hold % and
# buy/sell are computed from on-chain holders + recent trades.
# ---------------------------------------------------------------------------
[whales]
# Unlabeled holder this large (of circulating supply) counts as a whale.
size_pct = 0.02
# Cope Capital elite filter when COPE_API_KEY is set.
min_win_rate = 0.55
min_trades = 8
# Whale buying a >$50M token is accumulating, not a launch. Ignore the wallet.
ignore_mcap_usd = 50000000


# ---------------------------------------------------------------------------
# Scoring. A logistic model over normalized features. Weights live in
# state/weights.json and are updated by the learning loop.
# ---------------------------------------------------------------------------
[scoring]
# Minimum modeled win probability to consider a trade.
min_probability = 0.42
# Minimum expected value, as a fraction of position size, AFTER subtracting
# every cost we can predict. A positive score with negative EV is a losing
# trade with good self-esteem.
min_expected_value = 0.04
# Stage-2 0–10 composite. Weights: dist 20, crowd 25, flow 20, chart 25, narrative 10.
# Below this the token is not a buy candidate even if EV looks fine.
min_rubric = 4.0
# Until this many closed trades exist, the model has no opinion worth acting
# on and every feature contributes at its prior weight.
min_trades_for_learned_weights = 40
# How far a WINNING trade is assumed to run, as [ladder_rung, weight], used
# only for the expected-value prior until real trades replace it. Most winners
# stop at the first rung; assuming they all reach the last one would inflate
# prior EV roughly threefold and let the bot enter anything on day one.
prior_winner_ladder_reach = [[1, 0.60], [2, 0.25], [3, 0.15]]


# ---------------------------------------------------------------------------
# Aggressive learning. One `enabled` flip. Production [scoring]/[risk] above
# stay the graduate-to values. Does not touch gates (LP, mint, bundle, cluster).
# Floors from unique reject_score p/EV: 0.38/0.03 ≈ 3× vs 0.42/0.048.
# ---------------------------------------------------------------------------
[aggressive_learning]
enabled = true
graduate_at_closes = 40
min_probability = 0.38
min_expected_value = 0.03
max_concurrent_positions = 4


# ---------------------------------------------------------------------------
# Risk. The only part of this system that reliably makes money is the part
# that stops it from losing.
# ---------------------------------------------------------------------------
[risk]
# Total capital the bot is allowed to see, in USD. Set this to the wallet
# you will actually fund — a $100 account with this left at 1000 sizes like
# it is rich and then cannot exit.
equity_usd = 200.0
# Fraction of equity per position, before Kelly scaling. Small bankroll needs
# a larger fraction or min_position_usd is never reached.
max_position_pct = 0.16
# At copy_min mcap this fraction of equity; interpolates up to max_position_pct at copy_max.
min_position_pct = 0.06
min_position_usd = 10.0
# Two open at once so a weak bag cannot occupy the only slot.
max_concurrent_positions = 2
max_positions_per_chain = 2
# Hard cap on size as a fraction of pool liquidity. This binds long before the
# equity cap does on a small pool, and it is the difference between a position
# you can exit and a position you are.
max_position_pct_of_liquidity = 0.008
# After a close, do not bounce the same mint. One entry, one story.
reentry_cooldown_minutes = 180
# 0 = off. Paper learning phase — no daily entry budget.
max_entries_per_day = 0
# Fractional Kelly. Full Kelly is correct only if your probabilities are
# correct, and yours are not.
kelly_fraction = 0.25
# Realized loss in a single day that halts trading until manually resumed.
daily_loss_limit_pct = 0.12
# Streak cooldown sits out the next runner. Off: wait on the coin instead.
consecutive_loss_limit = 0
cooldown_minutes_base = 0
cooldown_backoff_multiplier = 2.0
# Two tokens from the same deployer, or the same launch cohort, are one bet.
max_exposure_per_deployer_pct = 0.06


# ---------------------------------------------------------------------------
# Exits. Entry gets the attention; exits get the money.
# ---------------------------------------------------------------------------
[exits]
# Scale out, keep a runner. Buy early, hold, sell slices on the way up —
# not a market-dump of the whole bag at the first green candle.
take_profit_ladder = [[1.50, 0.20], [2.20, 0.20], [3.50, 0.20]]
# Trailing stop, activated only after the first ladder rung fills. [auto]
trailing_stop_pct = 0.18
# Hard stop from entry. [auto]
stop_loss_pct = 0.35
# A dead coin is capital with an opportunity cost. A working one is allowed
# to sit: time stop only fires if it has not moved.
time_stop_minutes = 240
# ...unless it is up at least this much, in which case let it run.
time_stop_min_gain = 0.12
# Emergency exit: liquidity dropped by this fraction from its peak. This
# usually means the LP is leaving and you have seconds, not minutes.
liquidity_drawdown_exit = 0.35
# Spike died before the first take: dump this far off peak and the thesis
# is gone. Needs a real fade, not a 1-minute wick.
thesis_cut_from_peak = 0.40
# Peak/tape thesis_cut cannot fire before this. Invalidating the bet takes time.
thesis_cut_min_minutes = 25


# ---------------------------------------------------------------------------
# Stage 3. Same pipeline as entry, on the open bag. Price exits (stop / TP /
# drain) still win if they fire first. Rug/mint stays fast; "thesis is dead"
# waits for grace_seconds.
# ---------------------------------------------------------------------------
[hold]
lethal_grace_seconds = 90
grace_seconds = 1500
min_rubric = 4.5
strikes = 4
rescore_seconds = 45


# ---------------------------------------------------------------------------
# Execution
# ---------------------------------------------------------------------------
[execution]
# If the price moved more than this between scoring and submitting, abort. The
# signal was priced for a price that no longer exists.
max_price_drift_from_signal = 0.05
# Base slippage. Scaled by 5m volume (thin book → more, busy book → less),
# then bumped at most twice on a failed submit, never past max_slippage_bps.
slippage_bps = 150
min_slippage_bps = 80
max_slippage_bps = 350
slippage_volume_ref_usd = 20000.0
retry_slippage_bump_bps = 35
# Solana priority fee in lamports (not micro-lamports/CU). Scaled by volume,
# bumped 1.3x per retry, hard-capped so a $10 fill cannot spend $0.20 on tips.
priority_lamports = 80000
max_priority_lamports = 350000
retry_priority_mult = 1.30
# Legacy CU ceiling kept for docs; Jupiter v2 uses priorityFeeLamports above.
max_priority_fee_micro_lamports = 2000000
# Three attempts total. Bumps stop after the second even if you raise this.
max_submit_retries = 3
confirm_timeout_seconds = 45
# Paper mode fill model.
paper_slippage_bps = 180
paper_fee_bps = 75


# ---------------------------------------------------------------------------
# Learning. See docs/LEARNING.md for what each error class does.
# ---------------------------------------------------------------------------
[learning]
enabled = true
# Learning rate for the online logistic update.
learning_rate = 0.04
# L2 pull toward the prior weights. This is what stops 12 lucky trades from
# rewriting the model.
l2_prior_strength = 0.10
# A feature's weight cannot move until it has this many observations.
min_observations_per_feature = 25
# Retrain cadence.
retrain_every_closed_trades = 10
# Champion/challenger: a new weight set must beat the incumbent on holdout
# log-loss by this margin to be promoted.
promotion_margin = 0.01
# If live PnL over this many trades is worse than the previous weight set,
# roll back automatically.
rollback_window_trades = 20
# Rejected candidates are shadow-tracked for this long to measure what our
# filters cost us. Without this the model only ever learns from trades it
# already agreed with. 180 min is when runners tend to confirm; Dexscreener
# poll is capped at 30 open rows per risk tick so this is not 3x API load.
shadow_track_minutes = 180


# ---------------------------------------------------------------------------
# Per-chain playbooks. Hood is the live venue; Solana/BNB stay in the file
# but ENABLED_CHAINS should be robinhood_chain until Sol recovers.
# ---------------------------------------------------------------------------
[playbooks.solana]
# Coins die in minutes and vamps are everywhere. Short window, tight cluster.
max_age_minutes = 45
copy_max_age_minutes = 30
copy_min_mcap_usd = 100000
copy_max_mcap_usd = 2000000
max_cluster_pct = 0.20
max_unknown_top1_pct = 0.28
max_bundle_pct = 0.18
# KOL/whale is a boost, not a gate, until the lists are filled.
require_sponsor = false

[playbooks.bnb]
copy_max_age_minutes = 25
copy_min_mcap_usd = 100000
copy_max_mcap_usd = 2000000
max_cluster_pct = 0.45

[playbooks.robinhood_chain]
# Dip, hold, runner. Don't chase a 5m rip; first take later so the bag can reprice.
max_age_minutes = 240
copy_max_age_minutes = 90
copy_min_mcap_usd = 100000
copy_max_mcap_usd = 2000000
max_cluster_pct = 0.20
max_bundle_pct = 0.20
min_volume_5m = 5000
min_twitter_mentions = 2
max_chase_ret_5m = 0.12
thesis_cut_from_peak = 0.40
take_profit_ladder = [[2.00, 0.15], [3.50, 0.15], [6.00, 0.20]]
